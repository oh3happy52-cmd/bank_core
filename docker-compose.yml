services:
  mysql:
    image: mysql:8.4
    container_name: bank-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: bank
      MYSQL_PASSWORD: bank
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - bank-mysql-data:/var/lib/mysql

volumes:
  bank-mysql-data: