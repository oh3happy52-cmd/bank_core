spring.application.name=bank_core

# MySQL 접속 정보
spring.datasource.url=jdbc:mysql://localhost:3307/bank?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=bank
spring.datasource.password=bank

# 테이블은 Flyway가 만들고, JPA는 맞는지 검사만 함
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# 창고 문을 손님이 나갈 때까지 열어 둘까?" 하는 설정 우리는 화면이 안 보이는 프로젝트라 따라서 false 
spring.jpa.open-in-view=false

# JWT 서명용 비밀 키 (HS256은 32바이트 이상 필요)
# 개발용 값. 실제 서비스에서는 코드에 적지 않고 서버의 환경 변수로 넣음
jwt.secret=bank-core-local-dev-secret-key-change-me-0123456789
# 토큰 유효 시간 (분)
jwt.expiration-minutes=60

# 타행 이체: 다른 은행 응답을 기다리는 최대 시간 (밀리초). 넘으면 UNKNOWN
interbank.timeout-millis=1000
# 타행 이체: 자동 확인 작업이 UNKNOWN을 다시 물어보는 간격 (밀리초)
interbank.reconcile-delay-millis=5000
# 타행 이체: REQUESTED 상태로 이 시간(초)이 지나면, 처리 도중 서버가 멈춘 것으로 보고 자동 확인 대상에 넣음
interbank.stale-requested-seconds=30

# 멱등성: 번호표(Idempotency-Key) 메모를 보관하는 시간 (시간 단위). 지나면 같은 번호표라도 새 요청으로 처리
idempotency.ttl-hours=24
# 멱등성: 유효기간 지난 번호표 메모를 지우는 정리 작업 실행 시각 (초 분 시 일 월 요일). 기본: 매시 정각
idempotency.cleanup-cron=0 0 * * * *
