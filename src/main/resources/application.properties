spring.application.name=bank_core

# MySQL 접속 정보
spring.datasource.url=jdbc:mysql://localhost:3307/bank?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=bank
spring.datasource.password=bank

# 테이블은 Flyway가 만들고, JPA는 맞는지 검사만 함
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true