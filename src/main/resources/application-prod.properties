# [무엇] 운영(배포) 환경 전용 설정
# [역할] SPRING_PROFILES_ACTIVE=prod 일 때 application.properties 위에 덮어씀
#        - 비밀 값은 파일에 적지 않고 환경 변수에서 읽음 (값이 없으면 서버가 켜지지 않아 실수를 바로 알 수 있음)
#        - 운영에서는 SQL 로그를 끔 (로그가 너무 많아지고 성능에도 부담)
#        - 관리자 비밀번호도 환경 변수로 받아 서버가 켜질 때 설정 (AdminPasswordInitializer)
# [누가 쓰나] docker-compose.prod.yml로 띄운 앱 컨테이너
#            (DB 주소·계정·비밀번호는 docker-compose.prod.yml의 SPRING_DATASOURCE_* 환경 변수가 넣어 줌)

# JWT 서명 비밀 키: 개발용 값 대신 서버 환경 변수 JWT_SECRET 사용
jwt.secret=${JWT_SECRET}

# SQL 로그 끄기
spring.jpa.show-sql=false

# 관리자(admin) 비밀번호: 서버 환경 변수 ADMIN_PASSWORD (12자 이상, 없으면 서버가 켜지지 않음)
admin.password=${ADMIN_PASSWORD:}
